<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클라우드 위키 단어장</title>
    <!-- Firebase 실시간 데이터베이스 연동용 CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 92vh;
            max-height: 880px;
        }

        header {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 폴더 위키 바 */
        .folder-bar {
            background-color: #eef2ff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .folder-bar label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary);
            flex-shrink: 0;
        }

        .folder-bar input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            background: white;
            font-weight: 600;
            min-width: 80px;
        }

        .folder-btn {
            background-color: white;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .folder-btn:hover {
            background-color: #eef2ff;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 네비게이션 바 */
        nav {
            display: flex;
            background-color: white;
            border-top: 1px solid var(--border-color);
            padding: 10px 0;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px;
            transition: color 0.2s;
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background: white;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .sub-btn {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .add-sub-btn {
            background-color: #f8fafc;
            color: var(--primary);
            border: 1px dashed var(--primary);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 14px;
            transition: background-color 0.2s;
        }

        .add-sub-btn:hover {
            background-color: #eef2ff;
        }

        button.btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }

        button.btn:hover {
            background-color: var(--primary-hover);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sort-controls {
            display: flex;
            gap: 6px;
            width: 100%;
            margin-bottom: 12px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 12px;
        }

        .sort-controls select, .sort-controls button {
            padding: 8px 10px;
            font-size: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-weight: 600;
        }

        .sort-controls select {
            flex: 1;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 16px;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .word-info .eng {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-color);
        }

        .word-info .mea {
            font-size: 0.9rem;
            color: var(--primary);
            margin-top: 2px;
            font-weight: 600;
        }

        .word-info .ex-list {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-style: italic;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .edit-btn {
            background-color: #fef3c7;
            color: #d97706;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .delete-btn {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* 모달 팝업 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h3 {
            margin-bottom: 16px;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .modal-btns {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        /* 히스토리 리스트 스타일 */
        .history-item {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 10px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-meta {
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .history-desc {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
        }

        /* 퀴즈 스타일 */
        .quiz-card {
            text-align: center;
        }

        .quiz-badge {
            display: inline-block;
            background: #eef2ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .quiz-question {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 16px 0 24px 0;
            color: var(--text-color);
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            line-height: 1.6;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            width: 100%;
            padding: 14px;
            background-color: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            padding-left: 20px;
        }

        .choice-btn:hover {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .choice-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #166534 !important;
        }

        .choice-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b !important;
        }

        .quiz-result {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 40px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>클라우드 위키 단어장</header>
    
    <!-- 폴더 자체가 위키 페이지인 영역 -->
    <div class="folder-bar">
        <label for="folderInput">📁 위키문서:</label>
        <input type="text" id="folderInput" placeholder="폴더명" onchange="changeFolder()">
        <button class="folder-btn" style="background-color:var(--warning); color:white; border-color:var(--warning);" onclick="openHistoryModal()">📜 역사</button>
        <button class="folder-btn" onclick="openCloneMergeModal()">📋 복제/합치기</button>
        <span id="syncStatus" style="font-size: 0.7rem; color: var(--success); font-weight: 600; width: 100%; text-align: right;">☁️ 연동됨</span>
    </div>

    <div class="content">
        <!-- 1. 단어 추가 탭 -->
        <div id="tab-add" class="tab-content active">
            <h2 style="margin-bottom: 14px; font-size: 1.05rem;">단어 추가 / 문서 편집</h2>
            <div class="form-group">
                <label for="engInput">영어 단어</label>
                <input type="text" id="engInput" placeholder="예: run">
            </div>
            
            <div class="form-group">
                <label>뜻 입력 칸</label>
                <div id="meaningInputsContainer">
                    <div class="input-row">
                        <input type="text" class="meaning-input" placeholder="예: 달리다">
                    </div>
                </div>
                <button type="button" class="add-sub-btn" onclick="addMeaningField('meaningInputsContainer')">+ 뜻 칸 추가하기</button>
            </div>

            <div class="form-group">
                <label>예문 입력 칸 (_ 사용 가능)</label>
                <div id="exInputsContainer">
                    <div class="input-row">
                        <input type="text" class="ex-input" placeholder="예: I want to _ a business.">
                    </div>
                </div>
                <button type="button" class="add-sub-btn" onclick="addExField('exInputsContainer')">+ 예문 칸 추가하기</button>
            </div>

            <div class="form-group">
                <label for="addEditSummary">편집 요약 (어떤 내용을 고쳤나요?)</label>
                <input type="text" id="addEditSummary" placeholder="예: 새로운 단어 기여 및 예문 보완">
            </div>

            <button class="btn" id="addBtn">위키 문서에 기여하기</button>
        </div>

        <!-- 2. 단어 목록 탭 -->
        <div id="tab-list" class="tab-content">
            <div class="list-header">
                <h2 style="font-size: 1.05rem;">단어 목록 (<span id="wordCount">0</span>개)</h2>
            </div>
            
            <!-- 정렬 제어 바 -->
            <div class="sort-controls">
                <select id="sortBy" onchange="renderWordList()">
                    <option value="reg">등록순 (기본)</option>
                    <option value="alpha">알파벳순 (A-Z)</option>
                </select>
                <button id="sortOrderBtn" onclick="toggleSortOrder()">⬆️ 오름차순</button>
            </div>

            <div id="wordListContainer" class="word-list">
                <!-- 동적 생성 -->
            </div>
        </div>

        <!-- 3. 퀴즈 탭 -->
        <div id="tab-quiz" class="tab-content">
            <div id="quizArea">
                <!-- 동적 생성 -->
            </div>
        </div>
    </div>

    <!-- 하단 네비게이션 -->
    <nav>
        <button class="nav-btn active" onclick="switchTab('add', this)">
            ➕ 단어 추가
        </button>
        <button class="nav-btn" onclick="switchTab('list', this)">
            📖 단어 목록
        </button>
        <button class="nav-btn" onclick="switchTab('quiz', this)">
            🎯 퀴즈 풀기
        </button>
    </nav>
</div>

<!-- 단어 수정 모달 창 -->
<div id="editModal" class="modal-overlay">
    <div class="modal-card">
        <h3>단어 수정하기 (위키 편집)</h3>
        <input type="hidden" id="editIndex">
        <div class="form-group">
            <label>영어 단어</label>
            <input type="text" id="editEngInput">
        </div>
        <div class="form-group">
            <label>뜻</label>
            <div id="editMeaningContainer"></div>
            <button type="button" class="add-sub-btn" onclick="addMeaningField('editMeaningContainer')">+ 뜻 칸 추가</button>
        </div>
        <div class="form-group">
            <label>예문</label>
            <div id="editExContainer"></div>
            <button type="button" class="add-sub-btn" onclick="addExField('editExContainer')">+ 예문 칸 추가</button>
        </div>
        <div class="form-group">
            <label>편집 요약</label>
            <input type="text" id="editSummaryInput" placeholder="예: 의미 다듬기 및 오타 수정">
        </div>
        <div class="modal-btns">
            <button class="btn" style="background-color:#94a3b8;" onclick="closeEditModal()">취소</button>
            <button class="btn" onclick="saveEditedWord()">저장하기</button>
        </div>
    </div>
</div>

<!-- 폴더 역사(히스토리) 보기 모달 창 -->
<div id="historyModal" class="modal-overlay">
    <div class="modal-card">
        <h3>📜 현재 폴더 위키 역사 (History)</h3>
        <p style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:12px;">이전 버전으로 되돌리면 해당 시점의 상태로 폴더가 즉시 복구됩니다.</p>
        
        <div id="historyListContainer" style="max-height: 320px; overflow-y: auto;">
            <!-- 동적 생성 -->
        </div>

        <div class="modal-btns" style="margin-top:16px;">
            <button class="btn" style="background-color:#94a3b8;" onclick="closeHistoryModal()">닫기</button>
        </div>
    </div>
</div>

<!-- 폴더 복제/합치기 모달 창 -->
<div id="cloneMergeModal" class="modal-overlay">
    <div class="modal-card">
        <h3>📋 다른 폴더 불러오기 / 병합</h3>
        <div class="form-group">
            <label>가져올 대상 폴더 이름</label>
            <input type="text" id="otherFolderInput" placeholder="폴더 이름 입력">
        </div>
        <div style="display:flex; gap:6px;">
            <button class="btn" style="background-color:var(--success); font-size:0.85rem;" onclick="cloneFolderData()">새 폴더로 복제</button>
            <button class="btn" style="background-color:var(--primary); font-size:0.85rem;" onclick="mergeFolderData()">현재 폴더에 합치기</button>
        </div>
        <div class="modal-btns" style="margin-top:16px;">
            <button class="btn" style="background-color:#94a3b8;" onclick="closeCloneMergeModal()">닫기</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD-TestKeyForDemoAppOnly123456789",
        authDomain: "vocab-app-demo.firebaseapp.com",
        projectId: "vocab-app-demo",
    };

    let db = null;
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
    } catch (e) {
        console.log("Firebase 로컬모드 작동");
    }

    let currentFolder = localStorage.getItem('current_vocab_folder') || 'my_default_folder';
    document.getElementById('folderInput').value = currentFolder;
    let words = [];
    let histories = [];
    let isAscending = true; // 오름차순(true) / 내림차순(false)

    let editorName = localStorage.getItem('wiki_editor_name');
    if (!editorName) {
        editorName = '기여자_' + Math.floor(Math.random() * 8999 + 1000);
        localStorage.setItem('wiki_editor_name', editorName);
    }

    function changeFolder() {
        const newFolder = document.getElementById('folderInput').value.trim();
        if (!newFolder) {
            alert('폴더 이름을 입력해주세요!');
            document.getElementById('folderInput').value = currentFolder;
            return;
        }
        currentFolder = newFolder;
        localStorage.setItem('current_vocab_folder', currentFolder);
        loadWordsFromCloud();
    }

    function loadWordsFromCloud() {
        const statusSpan = document.getElementById('syncStatus');
        if (db) {
            statusSpan.textContent = "☁️ 동기화 중...";
            db.collection("vocab_folders").doc(currentFolder).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    words = data.words || [];
                    histories = data.histories || [];
                } else {
                    words = [];
                    histories = [];
                }
                statusSpan.textContent = "☁️ 연동됨 (" + currentFolder + ")";
                updateActiveView();
            }).catch(() => {
                loadFromLocalFallback();
            });
        } else {
            loadFromLocalFallback();
        }
    }

    function loadFromLocalFallback() {
        const savedWords = localStorage.getItem('vocab_folder_' + currentFolder);
        const savedHistories = localStorage.getItem('vocab_history_' + currentFolder);
        words = savedWords ? JSON.parse(savedWords) : [];
        histories = savedHistories ? JSON.parse(savedHistories) : [];
        document.getElementById('syncStatus').textContent = "💾 로컬 (" + currentFolder + ")";
        updateActiveView();
    }

    function saveWordsWithHistory(summaryText) {
        const timestamp = new Date().toLocaleString();
        const newHistoryItem = {
            time: timestamp,
            editor: editorName,
            summary: summaryText || '내용 수정',
            wordsSnapshot: JSON.parse(JSON.stringify(words))
        };

        histories.unshift(newHistoryItem);
        if (histories.length > 20) histories.pop();

        if (db) {
            db.collection("vocab_folders").doc(currentFolder).set({
                words: words,
                histories: histories,
                updatedAt: new Date()
            }).catch(() => {});
        }
        localStorage.setItem('vocab_folder_' + currentFolder, JSON.stringify(words));
        localStorage.setItem('vocab_history_' + currentFolder, JSON.stringify(histories));
    }

    function updateActiveView() {
        const activeTab = document.querySelector('.tab-content.active').id;
        if (activeTab === 'tab-list') renderWordList();
        if (activeTab === 'tab-quiz') startQuiz();
    }

    loadWordsFromCloud();

    function switchTab(tabName, btnElement) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

        document.getElementById('tab-' + tabName).classList.add('active');
        btnElement.classList.add('active');

        if (tabName === 'list') {
            renderWordList();
        } else if (tabName === 'quiz') {
            startQuiz();
        }
    }

    function addMeaningField(containerId, defaultValue = '') {
        const container = document.getElementById(containerId);
        const row = document.createElement('div');
        row.className = 'input-row';
        row.innerHTML = `
            <input type="text" class="meaning-input" placeholder="뜻 입력" value="${escapeHtml(defaultValue)}">
            <button type="button" class="sub-btn" onclick="this.parentElement.remove()">삭제</button>
        `;
        container.appendChild(row);
    }

    function addExField(containerId, defaultValue = '') {
        const container = document.getElementById(containerId);
        const row = document.createElement('div');
        row.className = 'input-row';
        row.innerHTML = `
            <input type="text" class="ex-input" placeholder="예문 입력 (_ 사용 가능)" value="${escapeHtml(defaultValue)}">
            <button type="button" class="sub-btn" onclick="this.parentElement.remove()">삭제</button>
        `;
        container.appendChild(row);
    }

    document.getElementById('addBtn').addEventListener('click', () => {
        const eng = document.getElementById('engInput').value.trim();
        const meaningInputs = document.querySelectorAll('#meaningInputsContainer .meaning-input');
        const exInputs = document.querySelectorAll('#exInputsContainer .ex-input');
        const summary = document.getElementById('addEditSummary').value.trim() || `'${eng}' 단어 추가`;

        if (!eng) {
            alert('영어 단어를 입력해주세요!');
            return;
        }

        const meanings = [];
        meaningInputs.forEach(input => {
            const val = input.value.trim();
            if (val) meanings.push(val);
        });

        if (meanings.length === 0) {
            alert('최소 하나 이상의 뜻을 입력해주세요!');
            return;
        }

        const examples = [];
        exInputs.forEach(input => {
            const val = input.value.trim();
            if (val) examples.push(val);
        });

        words.push({ eng, meanings, examples });
        saveWordsWithHistory(summary);

        document.getElementById('engInput').value = '';
        document.getElementById('addEditSummary').value = '';
        document.getElementById('meaningInputsContainer').innerHTML = `
            <div class="input-row">
                <input type="text" class="meaning-input" placeholder="예: 달리다">
            </div>
        `;
        document.getElementById('exInputsContainer').innerHTML = `
            <div class="input-row">
                <input type="text" class="ex-input" placeholder="예: I want to _ a business.">
            </div>
        `;
        alert(`[${currentFolder}] 위키 문서에 '${eng}' 단어가 기여되었습니다!`);
    });

    function openEditModal(index) {
        // 실제 원본 인덱스를 찾기 위해 현재 정렬된 상태의 렌더링용 배열에서 원래 인덱스를 매핑해야 하지만, 
        // 간단한 편집을 위해 단어 객체 자체를 찾거나 인덱스를 안전하게 넘깁니다.
    }

    // 수정 모달을 안전하게 처리하기 위한 전역 변수
    let editingOriginalIndex = null;

    function openEditModalByObject(engText) {
        const index = words.findIndex(w => w.eng === engText);
        if (index === -1) return;
        editingOriginalIndex = index;
        const itemObj = words[index];

        document.getElementById('editEngInput').value = itemObj.eng;
        document.getElementById('editSummaryInput').value = `'${itemObj.eng}' 단어 수정`;

        const meaningContainer = document.getElementById('editMeaningContainer');
        meaningContainer.innerHTML = '';
        itemObj.meanings.forEach(m => addMeaningField('editMeaningContainer', m));

        const exContainer = document.getElementById('editExContainer');
        exContainer.innerHTML = '';
        if (itemObj.examples) {
            itemObj.examples.forEach(ex => addExField('editExContainer', ex));
        }

        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function saveEditedWord() {
        const index = editingOriginalIndex;
        if (index === null || index === undefined) return;

        const newEng = document.getElementById('editEngInput').value.trim();
        const meaningInputs = document.querySelectorAll('#editMeaningContainer .meaning-input');
        const exInputs = document.querySelectorAll('#editExContainer .ex-input');
        const summary = document.getElementById('editSummaryInput').value.trim() || `'${newEng}' 수정`;

        if (!newEng) {
            alert('영어 단어를 입력해주세요!');
            return;
        }

        const newMeanings = [];
        meaningInputs.forEach(input => {
            const val = input.value.trim();
            if (val) newMeanings.push(val);
        });

        if (newMeanings.length === 0) {
            alert('최소 하나 이상의 뜻을 입력해주세요!');
            return;
        }

        const newExamples = [];
        exInputs.forEach(input => {
            const val = input.value.trim();
            if (val) newExamples.push(val);
        });

        words[index] = { eng: newEng, meanings: newMeanings, examples: newExamples };
        saveWordsWithHistory(summary);
        closeEditModal();
        renderWordList();
        alert('위키 문서 내용이 성공적으로 수정되었습니다!');
    }

    // 역사 모달 열기/닫기
    function openHistoryModal() {
        const container = document.getElementById('historyListContainer');
        container.innerHTML = '';

        if (!histories || histories.length === 0) {
            container.innerHTML = '<div class="empty-state">이 문서에 기록된 편집 히스토리가 없습니다.</div>';
        } else {
            histories.forEach((hist, hIndex) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-meta">
                        <span>👤 ${escapeHtml(hist.editor)}</span>
                        <span>🕒 ${hist.time}</span>
                    </div>
                    <div class="history-desc">${escapeHtml(hist.summary)} (단어 ${hist.wordsSnapshot.length}개)</div>
                    <button class="folder-btn" style="align-self: flex-start; margin-top:4px;" onclick="restoreVersion(${hIndex})">이 버전으로 되돌리기(복구)</button>
                `;
                container.appendChild(div);
            });
        }

        document.getElementById('historyModal').style.display = 'flex';
    }

    function closeHistoryModal() {
        document.getElementById('historyModal').style.display = 'none';
    }

    function restoreVersion(hIndex) {
        const targetHist = histories[hIndex];
        if (confirm(`[${targetHist.time}] 버전으로 문서를 복구하시겠습니까?`)) {
            words = JSON.parse(JSON.stringify(targetHist.wordsSnapshot));
            saveWordsWithHistory(`역사 복구: ${targetHist.summary}`);
            closeHistoryModal();
            renderWordList();
            alert('선택하신 버전으로 성공적으로 복구되었습니다!');
        }
    }

    // 복제/합치기 모달
    function openCloneMergeModal() {
        document.getElementById('cloneMergeModal').style.display = 'flex';
    }

    function closeCloneMergeModal() {
        document.getElementById('cloneMergeModal').style.display = 'none';
    }

    function cloneFolderData() {
        const sourceFolder = document.getElementById('otherFolderInput').value.trim();
        if (!sourceFolder) {
            alert('대상 폴더 이름을 입력하세요.');
            return;
        }

        if (db) {
            db.collection("vocab_folders").doc(sourceFolder).get().then((doc) => {
                if (doc.exists && doc.data().words) {
                    const clonedWords = doc.data().words;
                    const newName = prompt('새로운 위키 문서 이름을 입력하세요:', sourceFolder + '_copy');
                    if (!newName) return;

                    currentFolder = newName.trim();
                    document.getElementById('folderInput').value = currentFolder;
                    localStorage.setItem('current_vocab_folder', currentFolder);
                    words = clonedWords;
                    histories = [];
                    saveWordsWithHistory('문서 복제 생성');
                    closeCloneMergeModal();
                    renderWordList();
                    alert(`'${currentFolder}' 문서가 생성되었습니다!`);
                } else {
                    alert('해당 폴더를 찾을 수 없습니다.');
                }
            });
        }
    }

    function mergeFolderData() {
        const targetFolder = document.getElementById('otherFolderInput').value.trim();
        if (!targetFolder) {
            alert('합칠 폴더 이름을 입력하세요.');
            return;
        }

        if (db) {
            db.collection("vocab_folders").doc(targetFolder).get().then((doc) => {
                if (doc.exists && doc.data().words) {
                    const otherWords = doc.data().words;
                    if (confirm(`'${targetFolder}'의 단어들을 현재 문서에 합치시겠습니까?`)) {
                        words = [...words, ...otherWords];
                        saveWordsWithHistory(`'${targetFolder}' 문서 병합`);
                        closeCloneMergeModal();
                        renderWordList();
                        alert('성공적으로 합쳐졌습니다!');
                    }
                } else {
                    alert('대상 폴더가 존재하지 않습니다.');
                }
            });
        }
    }

    function toggleSortOrder() {
        isAscending = !isAscending;
        const btn = document.getElementById('sortOrderBtn');
        btn.textContent = isAscending ? "⬆️ 오름차순" : "⬇️ 내림차순";
        renderWordList();
    }

    function renderWordList() {
        const container = document.getElementById('wordListContainer');
        const countSpan = document.getElementById('wordCount');
        const sortBy = document.getElementById('sortBy').value;
        container.innerHTML = '';

        countSpan.textContent = words.length;

        if (words.length === 0) {
            container.innerHTML = '<div class="empty-state">등록된 단어가 없습니다.<br>첫 단어를 기여해보세요!</div>';
            return;
        }

        // 정렬 로직 복사본 생성
        let displayWords = [...words];

        if (sortBy === 'alpha') {
            displayWords.sort((a, b) => {
                const textA = a.eng.toLowerCase();
                const textB = b.eng.toLowerCase();
                if (textA < textB) return isAscending ? -1 : 1;
                if (textA > textB) return isAscending ? 1 : -1;
                return 0;
            });
        } else {
            // 등록순 (배열 인덱스 기준)
            if (!isAscending) {
                displayWords.reverse();
            }
        }

        displayWords.forEach((itemObj) => {
            const originalIndex = words.findIndex(w => w.eng === itemObj.eng && JSON.stringify(w.meanings) === JSON.stringify(itemObj.meanings));
            const item = document.createElement('div');
            item.className = 'word-item';

            const meaDisplay = itemObj.meanings.join(', ');
            let exHtml = '';
            if (itemObj.examples && itemObj.examples.length > 0) {
                exHtml = `<div class="ex-list">예문: <br>` + itemObj.examples.map(ex => `- ${escapeHtml(ex)}`).join('<br>') + `</div>`;
            }

            item.innerHTML = `
                <div class="word-info">
                    <div class="eng">${escapeHtml(itemObj.eng)}</div>
                    <div class="mea">뜻: ${escapeHtml(meaDisplay)}</div>
                    ${exHtml}
                </div>
            `;

            const actionDiv = document.createElement('div');
            actionDiv.className = 'action-buttons';

            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.textContent = '편집';
            editBtn.addEventListener('click', () => openEditModalByObject(itemObj.eng));

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '삭제';
            delBtn.addEventListener('click', () => {
                const summary = prompt(`삭제 이유(편집 요약)를 입력해주세요:`, `단어 삭제`);
                if (summary !== null) {
                    words.splice(originalIndex, 1);
                    saveWordsWithHistory(summary);
                    renderWordList();
                }
            });

            actionDiv.appendChild(editBtn);
            actionDiv.appendChild(delBtn);
            item.appendChild(actionDiv);
            container.appendChild(item);
        });
    }

    let quizList = [];
    let currentQuizIndex = 0;
    let quizScore = 0;

    function startQuiz() {
        const quizArea = document.getElementById('quizArea');

        if (words.length < 5) {
            quizArea.innerHTML = `<div class="empty-state">퀴즈를 풀려면 최소 5개 이상의 단어가 필요합니다!<br>(현재 단어 수: ${words.length}개)</div>`;
            return;
        }

        const indices = [...Array(words.length).keys()];
        quizList = indices.sort(() => 0.5 - Math.random()).slice(0, 5);
        currentQuizIndex = 0;
        quizScore = 0;
        showQuestion();
    }

    function showQuestion() {
        const quizArea = document.getElementById('quizArea');
        if (currentQuizIndex >= quizList.length) {
            quizArea.innerHTML = `
                <div class="quiz-result">
                    🎉 퀴즈 완료!<br><br>
                    총 5문제 중 <span style="color:var(--primary);">${quizScore}</span>문제를 맞추셨습니다!
                    <br><br>
                    <button class="btn" onclick="startQuiz()">다시 풀기</button>
                </div>
            `;
            return;
        }

        const correctIndex = quizList[currentQuizIndex];
        const correctItem = words[correctIndex];
        const correctMea = correctItem.meanings[Math.floor(Math.random() * correctItem.meanings.length)];

        let questionType = '단어 퀴즈';
        let questionText = correctItem.eng;

        if (correctItem.examples && correctItem.examples.length > 0 && Math.random() > 0.4) {
            questionType = '예문 빈칸 퀴즈';
            const rawEx = correctItem.examples[Math.floor(Math.random() * correctItem.examples.length)];
            questionText = rawEx.replace(/_+/g, '_______');
        }

        let allOtherMeanings = [];
        words.forEach((item, idx) => {
            if (idx !== correctIndex) {
                item.meanings.forEach(m => {
                    if (m !== correctMea) allOtherMeanings.push(m);
                });
            }
        });

        let uniqueDistractors = [...new Set(allOtherMeanings)];
        if (uniqueDistractors.length < 4) {
            words.forEach(item => {
                item.meanings.forEach(m => {
                    if (m !== correctMea && !uniqueDistractors.includes(m)) uniqueDistractors.push(m);
                });
            });
        }

        const shuffledDistractors = uniqueDistractors.sort(() => 0.5 - Math.random()).slice(0, 4);
        const choices = [correctMea, ...shuffledDistractors].sort(() => 0.5 - Math.random());

        quizArea.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 0.85rem; color: var(--text-secondary);">문제 ${currentQuizIndex + 1} / 5</span>
                <span class="quiz-badge">${questionType}</span>
            </div>
            <div class="quiz-card">
                <div class="quiz-question">${escapeHtml(questionText)}</div>
                <div class="choices" id="choicesContainer"></div>
            </div>
        `;

        const choicesContainer = document.getElementById('choicesContainer');
        choices.forEach(choiceText => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = choiceText;
            btn.addEventListener('click', () => {
                Array.from(choicesContainer.children).forEach(b => b.disabled = true);

                if (choiceText === correctMea) {
                    btn.classList.add('correct');
                    quizScore++;
                } else {
                    btn.classList.add('incorrect');
                    Array.from(choicesContainer.children).forEach(b => {
                        if (b.textContent === correctMea) b.classList.add('correct');
                    });
                }

                setTimeout(() => {
                    currentQuizIndex++;
                    showQuestion();
                }, 1000);
            });
            choicesContainer.appendChild(btn);
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>
