<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클라우드 위키 단어장</title>
    <!-- Firebase 실시간 데이터베이스 연동용 CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 92vh;
            max-height: 880px;
        }

        header {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 폴더 제어 바 */
        .folder-bar {
            background-color: #eef2ff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .folder-bar label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary);
            flex-shrink: 0;
        }

        .folder-bar input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            background: white;
            font-weight: 600;
            min-width: 90px;
        }

        .folder-btn {
            background-color: white;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .folder-btn:hover {
            background-color: #eef2ff;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 네비게이션 바 */
        nav {
            display: flex;
            background-color: white;
            border-top: 1px solid var(--border-color);
            padding: 10px 0;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px;
            transition: color 0.2s;
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .sub-btn {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .add-sub-btn {
            background-color: #f8fafc;
            color: var(--primary);
            border: 1px dashed var(--primary);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 14px;
            transition: background-color 0.2s;
        }

        .add-sub-btn:hover {
            background-color: #eef2ff;
        }

        button.btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }

        button.btn:hover {
            background-color: var(--primary-hover);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 16px;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .word-info .eng {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-color);
        }

        .word-info .mea {
            font-size: 0.9rem;
            color: var(--primary);
            margin-top: 2px;
            font-weight: 600;
        }

        .word-info .ex-list {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-style: italic;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .edit-btn {
            background-color: #fef3c7;
            color: #d97706;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .delete-btn {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* 모달 팝업 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h3 {
            margin-bottom: 16px;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .modal-btns {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        /* 히스토리 리스트 스타일 */
        .history-item {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 10px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-meta {
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .history-desc {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
        }

        /* 퀴즈 스타일 */
        .quiz-card {
            text-align: center;
        }

        .quiz-badge {
            display: inline-block;
            background: #eef2ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .quiz-question {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 16px 0 24px 0;
            color: var(--text-color);
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            line-height: 1.6;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            width: 100%;
            padding: 14px;
            background-color: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            padding-left: 20px;
        }

        .choice-btn:hover {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .choice-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #166534 !important;
        }

        .choice-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b !important;
        }

        .quiz-result {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 40px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>클라우드 위키 단어장</header>
    
    <!-- 폴더 제어 바 -->
    <div class="folder-bar">
        <label for="folderInput">📁 폴더:</label>
        <input type="text" id="folderInput" placeholder="폴더 이름" onchange="changeFolder()">
        <button class="folder-btn" onclick="openFolderModal()">📂 위키메뉴</button>
        <span id="syncStatus" style="font-size: 0.72rem; color: var(--success); font-weight: 600; width: 100%; text-align: right;">☁️ 연동됨</span>
    </div>

    <div class="content">
        <!-- 1. 단어 추가 탭 -->
        <div id="tab-add" class="tab-content active">
            <h2 style="margin-bottom: 14px; font-size: 1.05rem;">새 단어 / 예문 등록 (위키 편집)</h2>
            <div class="form-group">
                <label for="engInput">영어 단어</label>
                <input type="text" id="engInput" placeholder="예: run">
            </div>
            
            <div class="form-group">
                <label>뜻 입력 칸</label>
                <div id="meaningInputsContainer">
                    <div class="input-row">
                        <input type="text" class="meaning-input" placeholder="예: 달리다">
                    </div>
                </div>
                <button type="button" class="add-sub-btn" onclick="addMeaningField('meaningInputsContainer')">+ 뜻 칸 추가하기</button>
            </div>

            <div class="form-group">
                <label>예문 입력 칸 (_ 사용 가능)</label>
                <div id="exInputsContainer">
                    <div class="input-row">
                        <input type="text" class="ex-input" placeholder="예: I want to _ a business.">
                    </div>
                </div>
                <button type="button" class="add-sub-btn" onclick="addExField('exInputsContainer')">+ 예문 칸 추가하기</button>
            </div>

            <div class="form-group">
                <label for="addEditSummary">편집 요약 (어떤 내용을 추가하셨나요?)</label>
                <input type="text" id="addEditSummary" placeholder="예: 새로운 단어 5개 추가 및 오타 수정">
            </div>

            <button class="btn" id="addBtn">위키에 단어 기여하기</button>
        </div>

        <!-- 2. 단어 목록 탭 -->
        <div id="tab-list" class="tab-content">
            <div class="list-header">
                <h2 style="font-size: 1.05rem;">단어장 목록 (<span id="wordCount">0</span>개)</h2>
            </div>
            <div id="wordListContainer" class="word-list">
                <!-- 동적 생성 -->
            </div>
        </div>

        <!-- 3. 퀴즈 탭 -->
        <div id="tab-quiz" class="tab-content">
            <div id="quizArea">
                <!-- 동적 생성 -->
            </div>
        </div>
    </div>

    <!-- 하단 네비게이션 -->
    <nav>
        <button class="nav-btn active" onclick="switchTab('add', this)">
            ➕ 단어 추가
        </button>
        <button class="nav-btn" onclick="switchTab('list', this)">
            📖 단어 목록
        </button>
        <button class="nav-btn" onclick="switchTab('quiz', this)">
            🎯 퀴즈 풀기
        </button>
    </nav>
</div>

<!-- 단어 수정 모달 창 -->
<div id="editModal" class="modal-overlay">
    <div class="modal-card">
        <h3>단어 수정하기 (위키 편집)</h3>
        <input type="hidden" id="editIndex">
        <div class="form-group">
            <label>영어 단어</label>
            <input type="text" id="editEngInput">
        </div>
        <div class="form-group">
            <label>뜻</label>
            <div id="editMeaningContainer"></div>
            <button type="button" class="add-sub-btn" onclick="addMeaningField('editMeaningContainer')">+ 뜻 칸 추가</button>
        </div>
        <div class="form-group">
            <label>예문</label>
            <div id="editExContainer"></div>
            <button type="button" class="add-sub-btn" onclick="addExField('editExContainer')">+ 예문 칸 추가</button>
        </div>
        <div class="form-group">
            <label>편집 요약</label>
            <input type="text" id="editSummaryInput" placeholder="예: 단어 의미 보완 및 예문 추가">
        </div>
        <div class="modal-btns">
            <button class="btn" style="background-color:#94a3b8;" onclick="closeEditModal()">취소</button>
            <button class="btn" onclick="saveEditedWord()">저장하기</button>
        </div>
    </div>
</div>

<!-- 폴더 위키 메뉴 모달 창 -->
<div id="folderModal" class="modal-overlay">
    <div class="modal-card">
        <h3>📁 폴더 위키 메뉴</h3>
        
        <div class="form-group">
            <label>🔍 폴더 검색 / 이동</label>
            <div class="input-row">
                <input type="text" id="searchFolderInput" placeholder="찾을 폴더 이름">
                <button class="btn" style="margin-top:0; width:auto; padding:12px 16px;" onclick="searchAndMoveFolder()">이동</button>
            </div>
        </div>
        <hr style="margin: 14px 0; border:0; border-top:1px solid var(--border-color);">

        <div class="form-group">
            <label>📜 폴더 역사 (히스토리 & 복구)</label>
            <button class="btn" style="background-color:var(--warning);" onclick="openHistoryModal()">과거 버전 보기 및 복구</button>
        </div>
        <hr style="margin: 14px 0; border:0; border-top:1px solid var(--border-color);">

        <div class="form-group">
            <label>📋 다른 폴더 복제하기 / 합치기</label>
            <div class="input-row">
                <input type="text" id="otherFolderInput" placeholder="대상 폴더 이름">
            </div>
            <div style="display:flex; gap:6px;">
                <button class="btn" style="margin-top:0; background-color:var(--success); font-size:0.85rem; padding:10px;" onclick="cloneFolderData()">복제하기</button>
                <button class="btn" style="margin-top:0; background-color:var(--primary); font-size:0.85rem; padding:10px;" onclick="mergeFolderData()">합치기</button>
            </div>
        </div>

        <div class="modal-btns" style="margin-top:16px;">
            <button class="btn" style="background-color:#94a3b8;" onclick="closeFolderModal()">닫기</button>
        </div>
    </div>
</div>

<!-- 히스토리 (역사) 보기 모달 창 -->
<div id="historyModal" class="modal-overlay">
    <div class="modal-card">
        <h3>📜 폴더 편집 역사 (History)</h3>
        <p style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:12px;">이전 버전으로 되돌리면 해당 시점의 상태로 폴더가 복구됩니다.</p>
        
        <div id="historyListContainer" style="max-height: 320px; overflow-y: auto;">
            <!-- 동적 생성 -->
        </div>

        <div class="modal-btns" style="margin-top:16px;">
            <button class="btn" style="background-color:#94a3b8;" onclick="closeHistoryModal()">닫기</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD-TestKeyForDemoAppOnly123456789",
        authDomain: "vocab-app-demo.firebaseapp.com",
        projectId: "vocab-app-demo",
    };

    let db = null;
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
    } catch (e) {
        console.log("Firebase 로컬모드 작동");
    }

    let currentFolder = localStorage.getItem('current_vocab_folder') || 'my_default_folder';
    document.getElementById('folderInput').value = currentFolder;
    let words = [];
    let histories = [];

    // 사용자 기여자 식별용 닉네임 (최초 1회 랜덤 또는 지정)
    let editorName = localStorage.getItem('wiki_editor_name');
    if (!editorName) {
        editorName = '위키기여자_' + Math.floor(Math.random() * 8999 + 1000);
        localStorage.setItem('wiki_editor_name', editorName);
    }

    function changeFolder() {
        const newFolder = document.getElementById('folderInput').value.trim();
        if (!newFolder) {
            alert('폴더 이름을 입력해주세요!');
            document.getElementById('folderInput').value = currentFolder;
            return;
        }
        currentFolder = newFolder;
        localStorage.setItem('current_vocab_folder', currentFolder);
        loadWordsFromCloud();
    }

    function loadWordsFromCloud() {
        const statusSpan = document.getElementById('syncStatus');
        if (db) {
            statusSpan.textContent = "☁️ 동기화 중...";
            db.collection("vocab_folders").doc(currentFolder).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    words = data.words || [];
                    histories = data.histories || [];
                } else {
                    words = [];
                    histories = [];
                }
                statusSpan.textContent = "☁️ 위키 연동됨 (" + currentFolder + ")";
                updateActiveView();
            }).catch(() => {
                loadFromLocalFallback();
            });
        } else {
            loadFromLocalFallback();
        }
    }

    function loadFromLocalFallback() {
        const savedWords = localStorage.getItem('vocab_folder_' + currentFolder);
        const savedHistories = localStorage.getItem('vocab_history_' + currentFolder);
        words = savedWords ? JSON.parse(savedWords) : [];
        histories = savedHistories ? JSON.parse(savedHistories) : [];
        document.getElementById('syncStatus').textContent = "💾 로컬 모드 (" + currentFolder + ")";
        updateActiveView();
    }

    function saveWordsWithHistory(summaryText) {
        const timestamp = new Date().toLocaleString();
        const newHistoryItem = {
            time: timestamp,
            editor: editorName,
            summary: summaryText || '내용 수정',
            wordsSnapshot: JSON.parse(JSON.stringify(words))
        };

        histories.unshift(newHistoryItem); // 최신 히스토리를 맨 앞으로
        if (histories.length > 20) histories.pop(); // 최대 20개까지만 보관

        if (db) {
            db.collection("vocab_folders").doc(currentFolder).set({
                words: words,
                histories: histories,
                updatedAt: new Date()
            }).catch(() => {});
        }
        localStorage.setItem('vocab_folder_' + currentFolder, JSON.stringify(words));
        localStorage.setItem('vocab_history_' + currentFolder, JSON.stringify(histories));
    }

    function updateActiveView() {
        const activeTab = document.querySelector('.tab-content.active').id;
        if (activeTab === 'tab-list') renderWordList();
        if (activeTab === 'tab-quiz') startQuiz();
    }

    loadWordsFromCloud();

    function switchTab(tabName, btnElement) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

        document.getElementById('tab-' + tabName).classList.add('active');
        btnElement.classList.add('active');

        if (tabName === 'list') {
            renderWordList();
        } else if (tabName === 'quiz') {
            startQuiz();
        }
    }

    function addMeaningField(containerId, defaultValue = '') {
        const container = document.getElementById(containerId);
        const row = document.createElement('div');
        row.className = 'input-row';
        row.innerHTML = `
            <input type="text" class="meaning-input" placeholder="뜻 입력" value="${escapeHtml(defaultValue)}">
            <button type="button" class="sub-btn" onclick="this.parentElement.remove()">삭제</button>
        `;
        container.appendChild(row);
    }

    function addExField(containerId, defaultValue = '') {
        const container = document.getElementById(containerId);
        const row = document.createElement('div');
        row.className = 'input-row';
        row.innerHTML = `
            <input type="text" class="ex-input" placeholder="예문 입력 (_ 사용 가능)" value="${escapeHtml(defaultValue)}">
            <button type="button" class="sub-btn" onclick="this.parentElement.remove()">삭제</button>
        `;

    }

    document.getElementById('addBtn').addEventListener('click', () => {
        const eng = document.getElementById('engInput').value.trim();
        const meaningInputs = document.querySelectorAll('#meaningInputsContainer .meaning-input');
        const exInputs = document.querySelectorAll('#exInputsContainer .ex-input');
        const summary = document.getElementById('addEditSummary').value.trim() || `'${eng}' 단어 추가`;

        if (!eng) {
            alert('영어 단어를 입력해주세요!');
            return;
        }

        const meanings = [];
        meaningInputs.forEach(input => {
            const val = input.value.trim();
            if (val) meanings.push(val);
        });

        if (meanings.length === 0) {
            alert('최소 하나 이상의 뜻을 입력해주세요!');
            return;
        }

        const examples = [];
        exInputs.forEach(input => {
            const val = input.value.trim();
            if (val) examples.push(val);
        });

        words.push({ eng, meanings, examples });
        saveWordsWithHistory(summary);

        document.getElementById('engInput').value = '';
        document.getElementById('addEditSummary').value = '';
        document.getElementById('meaningInputsContainer').innerHTML = `
            <div class="input-row">
                <input type="text" class="meaning-input" placeholder="예: 달리다">
            </div>
        `;
        document.getElementById('exInputsContainer').innerHTML = `
            <div class="input-row">
                <input type="text" class="ex-input" placeholder="예: I want to _ a business.">
            </div>
        `;
        alert(`[${currentFolder}] 위키에 '${eng}' 단어가 기여되었습니다!`);
    });

    // 수정 팝업 열기
    function openEditModal(index) {
        const itemObj = words[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('editEngInput').value = itemObj.eng;
        document.getElementById('editSummaryInput').value = `'${itemObj.eng}' 단어 수정`;

        const meaningContainer = document.getElementById('editMeaningContainer');
        meaningContainer.innerHTML = '';
        itemObj.meanings.forEach(m => addMeaningField('editMeaningContainer', m));

        const exContainer = document.getElementById('editExContainer');
        exContainer.innerHTML = '';
        if (itemObj.examples) {
            itemObj.examples.forEach(ex => addExField('editExContainer', ex));
        }

        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function saveEditedWord() {
        const index = document.getElementById('editIndex').value;
        const newEng = document.getElementById('editEngInput').value.trim();
        const meaningInputs = document.querySelectorAll('#editMeaningContainer .meaning-input');
        const exInputs = document.querySelectorAll('#editExContainer .ex-input');
        const summary = document.getElementById('editSummaryInput').value.trim() || `'${newEng}' 수정`;

        if (!newEng) {
            alert('영어 단어를 입력해주세요!');
            return;
        }

        const newMeanings = [];
        meaningInputs.forEach(input => {
            const val = input.value.trim();
            if (val) newMeanings.push(val);
        });

        if (newMeanings.length === 0) {
            alert('최소 하나 이상의 뜻을 입력해주세요!');
            return;
        }

        const newExamples = [];
        exInputs.forEach(input => {
            const val = input.value.trim();
            if (val) newExamples.push(val);
        });

        words[index] = { eng: newEng, meanings: newMeanings, examples: newExamples };
        saveWordsWithHistory(summary);
        closeEditModal();
        renderWordList();
        alert('위키 내용이 성공적으로 수정 및 반영되었습니다!');
    }

    // 폴더 모달 열기/닫기
    function openFolderModal() {
        document.getElementById('folderModal').style.display = 'flex';
    }

    function closeFolderModal() {
        document.getElementById('folderModal').style.display = 'none';
    }

    // 폴더 검색 및 이동
    function searchAndMoveFolder() {
        const target = document.getElementById('searchFolderInput').value.trim();
        if (!target) {
            alert('이동할 폴더 이름을 입력하세요.');
            return;
        }
        document.getElementById('folderInput').value = target;
        changeFolder();
        closeFolderModal();
    }

    // 폴더 역사(히스토리) 모달 열기/닫기
    function openHistoryModal() {
        const container = document.getElementById('historyListContainer');
        container.innerHTML = '';

        if (!histories || histories.length === 0) {
            container.innerHTML = '<div class="empty-state">기록된 편집 히스토리가 없습니다.</div>';
        } else {
            histories.forEach((hist, hIndex) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-meta">
                        <span>👤 ${escapeHtml(hist.editor)}</span>
                        <span>🕒 ${hist.time}</span>
                    </div>
                    <div class="history-desc">${escapeHtml(hist.summary)} (단어 ${hist.wordsSnapshot.length}개)</div>
                    <button class="folder-btn" style="align-self: flex-start; margin-top:4px;" onclick="restoreVersion(${hIndex})">이 버전으로 되돌리기(복구)</button>
                `;
                container.appendChild(div);
            });
        }

        document.getElementById('historyModal').style.display = 'flex';
    }

    function closeHistoryModal() {
        document.getElementById('historyModal').style.display = 'none';
    }

    // 특정 버전으로 복구하기
    function restoreVersion(hIndex) {
        const targetHist = histories[hIndex];
        if (confirm(`[${targetHist.time}]에 기록된 버전으로 폴더를 복구하시겠습니까?`)) {
            words = JSON.parse(JSON.stringify(targetHist.wordsSnapshot));
            saveWordsWithHistory(`역사 기록 복구: ${targetHist.summary}`);
            closeHistoryModal();
            closeFolderModal();
            renderWordList();
            alert('선택하신 버전으로 성공적으로 복구되었습니다!');
        }
    }

    // 폴더 복제 기능
    function cloneFolderData() {
        const sourceFolder = document.getElementById('otherFolderInput').value.trim();
        if (!sourceFolder) {
            alert('대상 폴더 이름을 입력하세요.');
            return;
        }
        if (sourceFolder === currentFolder) {
            alert('현재 폴더와 동일합니다.');
            return;
        }

        if (db) {
            db.collection("vocab_folders").doc(sourceFolder).get().then((doc) => {
                if (doc.exists && doc.data().words) {
                    const clonedWords = doc.data().words;
                    const newFolderName = prompt('새로 만들 복제 폴더 이름을 입력하세요:', sourceFolder + '_copy');
                    if (!newFolderName) return;

                    currentFolder = newFolderName.trim();
                    document.getElementById('folderInput').value = currentFolder;
                    localStorage.setItem('current_vocab_folder', currentFolder);
                    words = clonedWords;
                    histories = [];
                    saveWordsWithHistory('폴더 복제 생성');
                    closeFolderModal();
                    renderWordList();
                    alert(`'${sourceFolder}' 폴더가 '${currentFolder}'로 성공적으로 복제되었습니다!`);
                } else {
                    alert('해당 이름의 폴더가 존재하지 않습니다.');
                }
            }).catch(() => {
                alert('폴더를 불러오는 중 오류가 발생했습니다.');
            });
        }
    }

    // 폴더 합치기 기능
    function mergeFolderData() {
        const targetFolder = document.getElementById('otherFolderInput').value.trim();
        if (!targetFolder) {
            alert('합칠 다른 폴더 이름을 입력하세요.');
            return;
        }
        if (targetFolder === currentFolder) {
            alert('현재 폴더와는 합칠 수 없습니다.');
            return;
        }

        if (db) {
            db.collection("vocab_folders").doc(targetFolder).get().then((doc) => {
                if (doc.exists && doc.data().words) {
                    const otherWords = doc.data().words;
                    if (confirm(`'${targetFolder}' 폴더에 있는 ${otherWords.length}개의 단어를 현재 폴더에 합치시겠습니까?`)) {
                        words = [...words, ...otherWords];
                        saveWordsWithHistory(`'${targetFolder}' 폴더 병합`);
                        closeFolderModal();
                        renderWordList();
                        alert('폴더가 성공적으로 합쳐졌습니다!');
                    }
                } else {
                    alert('합칠 대상 폴더가 존재하지 않거나 비어있습니다.');
                }
            }).catch(() => {
                alert('폴더를 불러오는 중 오류가 발생했습니다.');
            });
        }
    }

    function renderWordList() {
        const container = document.getElementById('wordListContainer');
        const countSpan = document.getElementById('wordCount');
        container.innerHTML = '';

        countSpan.textContent = words.length;

        if (words.length === 0) {
            container.innerHTML = '<div class="empty-state">이 폴더에 등록된 단어가 없습니다.<br>위키에 첫 단어를 기여해보세요!</div>';
            return;
        }

        words.forEach((itemObj, index) => {
            const item = document.createElement('div');
            item.className = 'word-item';

            const meaDisplay = itemObj.meanings.join(', ');
            let exHtml = '';
            if (itemObj.examples && itemObj.examples.length > 0) {
                exHtml = `<div class="ex-list">예문: <br>` + itemObj.examples.map(ex => `- ${escapeHtml(ex)}`).join('<br>') + `</div>`;
            }

            item.innerHTML = `
                <div class="word-info">
                    <div class="eng">${escapeHtml(itemObj.eng)}</div>
                    <div class="mea">뜻: ${escapeHtml(meaDisplay)}</div>
                    ${exHtml}
                </div>
            `;

            const actionDiv = document.createElement('div');
            actionDiv.className = 'action-buttons';

            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.textContent = '편집';
            editBtn.addEventListener('click', () => openEditModal(index));

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '삭제';
            delBtn.addEventListener('click', () => {
                const summary = prompt(`'${itemObj.eng}' 삭제 이유(편집 요약)를 입력해주세요:`, `단어 삭제`);
                if (summary !== null) {
                    words.splice(index, 1);
                    saveWordsWithHistory(summary);
                    renderWordList();
                }
            });

            actionDiv.appendChild(editBtn);
            actionDiv.appendChild(delBtn);
            item.appendChild(actionDiv);
            container.appendChild(item);
        });
    }

    let quizList = [];
    let currentQuizIndex = 0;
    let quizScore = 0;

    function startQuiz() {
        const quizArea = document.getElementById('quizArea');

        if (words.length < 5) {
            quizArea.innerHTML = `<div class="empty-state">퀴즈를 풀려면 현재 폴더에 최소 5개 이상의 단어가 필요합니다!<br>(현재 단어 수: ${words.length}개)</div>`;
            return;
        }

        const indices = [...Array(words.length).keys()];
        quizList = indices.sort(() => 0.5 - Math.random()).slice(0, 5);
        currentQuizIndex = 0;
        quizScore = 0;
        showQuestion();
    }

    function showQuestion() {
        const quizArea = document.getElementById('quizArea');
        if (currentQuizIndex >= quizList.length) {
            quizArea.innerHTML = `
                <div class="quiz-result">
                    🎉 퀴즈 완료!<br><br>
                    총 5문제 중 <span style="color:var(--primary);">${quizScore}</span>문제를 맞추셨습니다!
                    <br><br>
                    <button class="btn" onclick="startQuiz()">다시 풀기</button>
                </div>
            `;
            return;
        }

        const correctIndex = quizList[currentQuizIndex];
        const correctItem = words[correctIndex];

        const correctMea = correctItem.meanings[Math.floor(Math.random() * correctItem.meanings.length)];

        let questionType = '단어 퀴즈';
        let questionText = correctItem.eng;

        if (correctItem.examples && correctItem.examples.length > 0 && Math.random() > 0.4) {
            questionType = '예문 빈칸 퀴즈';
            const rawEx = correctItem.examples[Math.floor(Math.random() * correctItem.examples.length)];
            questionText = rawEx.replace(/_+/g, '_______');
        }

        let allOtherMeanings = [];
        words.forEach((item, idx) => {
            if (idx !== correctIndex) {
                item.meanings.forEach(m => {
                    if (m !== correctMea) {
                        allOtherMeanings.push(m);
                    }
                });
            }
        });

        let uniqueDistractors = [...new Set(allOtherMeanings)];
        
        if (uniqueDistractors.length < 4) {
            words.forEach(item => {
                item.meanings.forEach(m => {
                    if (m !== correctMea && !uniqueDistractors.includes(m)) {
                        uniqueDistractors.push(m);
                    }
                });
            });
        }

        const shuffledDistractors = uniqueDistractors.sort(() => 0.5 - Math.random()).slice(0, 4);
        const choices = [correctMea, ...shuffledDistractors].sort(() => 0.5 - Math.random());

        quizArea.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 0.85rem; color: var(--text-secondary);">문제 ${currentQuizIndex + 1} / 5</span>
                <span class="quiz-badge">${questionType}</span>
            </div>
            <div class="quiz-card">
                <div class="quiz-question">${escapeHtml(questionText)}</div>
                <div class="choices" id="choicesContainer"></div>
            </div>
        `;

        const choicesContainer = document.getElementById('choicesContainer');
        choices.forEach(choiceText => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = choiceText;
            btn.addEventListener('click', () => {
                Array.from(choicesContainer.children).forEach(b => b.disabled = true);

                if (choiceText === correctMea) {
                    btn.classList.add('correct');
                    quizScore++;
                } else {
                    btn.classList.add('incorrect');
                    Array.from(choicesContainer.children).forEach(b => {
                        if (b.textContent === correctMea) b.classList.add('correct');
                    });
                }

                setTimeout(() => {
                    currentQuizIndex++;
                    showQuestion();
                }, 1000);
            });
            choicesContainer.appendChild(btn);
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

        }

        .choice-btn:hover {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .choice-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #166534 !important;
        }

        .choice-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b !important;
        }

        .quiz-result {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 40px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>클라우드 연동 단어장</header>
    
    <!-- 폴더(방) 선택 바 -->
    <div class="folder-bar">
        <label for="folderInput">📁 단어장 폴더:</label>
        <input type="text" id="folderInput" value="my_default_folder" placeholder="폴더 이름 입력" onchange="changeFolder()">
        <span id="syncStatus" style="font-size: 0.75rem; color: var(--success); margin-left: auto; font-weight: 600;">☁️ 연동됨</span>
    </div>

    <div class="content">
        <!-- 1. 단어 추가 탭 -->
        <div id="tab-add" class="tab-content active">
            <h2 style="margin-bottom: 14px; font-size: 1.05rem;">새 단어 / 예문 등록</h2>
            <div class="form-group">
                <label for="engInput">영어 단어</label>
                <input type="text" id="engInput" placeholder="예: run">
            </div>
            
            <div class="form-group">
                <label>뜻 입력 칸</label>
                <div id="meaningInputsContainer">
                    <div class="input-row">
                        <input type="text" class="meaning-input" placeholder="예: 달리다">
                    </div>
                </div>
                <button type="button" class="add-sub-btn" onclick="addMeaningField()">+ 뜻 칸 추가하기</button>
            </div>

            <div class="form-group">
                <label>예문 입력 칸 (_ 사용 가능)</label>
                <div id="exInputsContainer">
                    <div class="input-row">
                        <input type="text" class="ex-input" placeholder="예: I want to _ a business.">
                    </div>
                </div>
                <button type="button" class="add-sub-btn" onclick="addExField()">+ 예문 칸 추가하기</button>
            </div>

            <button class="btn" id="addBtn">단어 추가하기</button>
        </div>

        <!-- 2. 단어 목록 탭 -->
        <div id="tab-list" class="tab-content">
            <div class="list-header">
                <h2 style="font-size: 1.05rem;">단어장 목록 (<span id="wordCount">0</span>개)</h2>
            </div>
            <div id="wordListContainer" class="word-list">
                <!-- 동적 생성 -->
            </div>
        </div>

        <!-- 3. 퀴즈 탭 -->
        <div id="tab-quiz" class="tab-content">
            <div id="quizArea">
                <!-- 동적 생성 -->
            </div>
        </div>
    </div>

    <!-- 하단 네비게이션 -->
    <nav>
        <button class="nav-btn active" onclick="switchTab('add', this)">
            ➕ 단어 추가
        </button>
        <button class="nav-btn" onclick="switchTab('list', this)">
            📖 단어 목록
        </button>
        <button class="nav-btn" onclick="switchTab('quiz', this)">
            🎯 퀴즈 풀기
        </button>
    </nav>
</div>

<script>
    // Firebase 무료 테스트 연동 설정
    const firebaseConfig = {
        apiKey: "AIzaSyD-TestKeyForDemoAppOnly123456789",
        authDomain: "vocab-app-demo.firebaseapp.com",
        projectId: "vocab-app-demo",
    };

    // Firebase 초기화 (오류 방지를 위해 안전하게 처리)
    let db = null;
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
    } catch (e) {
        console.log("Firebase 로컬모드 작동");
    }

    let currentFolder = localStorage.getItem('current_vocab_folder') || 'my_default_folder';
    document.getElementById('folderInput').value = currentFolder;

    let words = [];

    // 폴더 변경 시 호출
    function changeFolder() {
        const newFolder = document.getElementById('folderInput').value.trim();
        if (!newFolder) {
            alert('폴더 이름을 입력해주세요!');
            document.getElementById('folderInput').value = currentFolder;
            return;
        }
        currentFolder = newFolder;
        localStorage.setItem('current_vocab_folder', currentFolder);
        loadWordsFromCloud();
    }

    // 클라우드(또는 로컬)에서 단어 불러오기
    function loadWordsFromCloud() {
        const statusSpan = document.getElementById('syncStatus');
        if (db) {
            statusSpan.textContent = "☁️ 동기화 중...";
            db.collection("vocab_folders").doc(currentFolder).get().then((doc) => {
                if (doc.exists && doc.data().words) {
                    words = doc.data().words;
                } else {
                    words = [];
                }
                statusSpan.textContent = "☁️ 연동됨";
                updateActiveView();
            }).catch(() => {
                // 네트워크 오류 시 로컬스토리지 백업 활용
                loadFromLocalFallback();
            });
        } else {
            loadFromLocalFallback();
        }
    }

    function loadFromLocalFallback() {
        const saved = localStorage.getItem('vocab_folder_' + currentFolder);
        words = saved ? JSON.parse(saved) : [];
        document.getElementById('syncStatus').textContent = "💾 로컬 모드";
        updateActiveView();
    }

    // 단어 저장하기 (클라우드 + 로컬 백업)
    function saveWords() {
        if (db) {
            db.collection("vocab_folders").doc(currentFolder).set({
                words: words,
                updatedAt: new Date()
            }).catch(() => {});
        }
        localStorage.setItem('vocab_folder_' + currentFolder, JSON.stringify(words));
    }

    function updateActiveView() {
        const activeTab = document.querySelector('.tab-content.active').id;
        if (activeTab === 'tab-list') renderWordList();
        if (activeTab === 'tab-quiz') startQuiz();
    }

    // 초기 데이터 로드
    loadWordsFromCloud();

    function switchTab(tabName, btnElement) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

        document.getElementById('tab-' + tabName).classList.add('active');
        btnElement.classList.add('active');

        if (tabName === 'list') {
            renderWordList();
        } else if (tabName === 'quiz') {
            startQuiz();
        }
    }

    function addMeaningField() {
        const container = document.getElementById('meaningInputsContainer');
        const row = document.createElement('div');
        row.className = 'input-row';
        row.innerHTML = `
            <input type="text" class="meaning-input" placeholder="추가 뜻 입력">
            <button type="button" class="sub-btn" onclick="this.parentElement.remove()">삭제</button>
        `;
        container.appendChild(row);
    }

    function addExField() {
        const container = document.getElementById('exInputsContainer');
        const row = document.createElement('div');
        row.className = 'input-row';
        row.innerHTML = `
            <input type="text" class="ex-input" placeholder="추가 예문 입력 (_ 사용 가능)">
            <button type="button" class="sub-btn" onclick="this.parentElement.remove()">삭제</button>
        `;
        container.appendChild(row);
    }

    document.getElementById('addBtn').addEventListener('click', () => {
        const eng = document.getElementById('engInput').value.trim();
        const meaningInputs = document.querySelectorAll('.meaning-input');
        const exInputs = document.querySelectorAll('.ex-input');

        if (!eng) {
            alert('영어 단어를 입력해주세요!');
            return;
        }

        const meanings = [];
        meaningInputs.forEach(input => {
            const val = input.value.trim();
            if (val) meanings.push(val);
        });

        if (meanings.length === 0) {
            alert('최소 하나 이상의 뜻을 입력해주세요!');
            return;
        }

        const examples = [];
        exInputs.forEach(input => {
            const val = input.value.trim();
            if (val) examples.push(val);
        });

        words.push({ eng, meanings, examples });
        saveWords();

        // 입력창 초기화
        document.getElementById('engInput').value = '';
        document.getElementById('meaningInputsContainer').innerHTML = `
            <div class="input-row">
                <input type="text" class="meaning-input" placeholder="예: 달리다">
            </div>
        `;
        document.getElementById('exInputsContainer').innerHTML = `
            <div class="input-row">
                <input type="text" class="ex-input" placeholder="예: I want to _ a business.">
            </div>
        `;
        alert(`[${currentFolder}] 폴더에 '${eng}' 단어가 저장되었습니다!`);
    });

    function renderWordList() {
        const container = document.getElementById('wordListContainer');
        const countSpan = document.getElementById('wordCount');
        container.innerHTML = '';

        countSpan.textContent = words.length;

        if (words.length === 0) {
            container.innerHTML = '<div class="empty-state">이 폴더에 등록된 단어가 없습니다.<br>단어를 먼저 추가해보세요!</div>';
            return;
        }

        words.forEach((itemObj, index) => {
            const item = document.createElement('div');
            item.className = 'word-item';

            const meaDisplay = itemObj.meanings.join(', ');
            let exHtml = '';
            if (itemObj.examples && itemObj.examples.length > 0) {
                exHtml = `<div class="ex-list">예문: <br>` + itemObj.examples.map(ex => `- ${escapeHtml(ex)}`).join('<br>') + `</div>`;
            }

            item.innerHTML = `
                <div class="word-info">
                    <div class="eng">${escapeHtml(itemObj.eng)}</div>
                    <div class="mea">뜻: ${escapeHtml(meaDisplay)}</div>
                    ${exHtml}
                </div>
            `;

            const actionDiv = document.createElement('div');
            actionDiv.className = 'action-buttons';

            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.textContent = '수정';
            editBtn.addEventListener('click', () => {
                const newEng = prompt('수정할 영어 단어를 입력하세요:', itemObj.eng);
                if (newEng === null) return;
                const newMeaRaw = prompt('수정할 뜻을 입력하세요 (콤마로 구분):', itemObj.meanings.join(', '));
                if (newMeaRaw === null) return;
                
                const currentExStr = itemObj.examples ? itemObj.examples.join(' / ') : '';
                const newExRaw = prompt('수정할 예문들을 입력하세요 (구분은 / 기호 사용):', currentExStr);
                if (newExRaw === null) return;

                if (!newEng.trim() || !newMeaRaw.trim()) {
                    alert('단어와 뜻은 반드시 입력해야 합니다.');
                    return;
                }

                const newMeanings = newMeaRaw.split(',').map(m => m.trim()).filter(m => m !== '');
                const newExamples = newExRaw ? newExRaw.split('/').map(e => e.trim()).filter(e => e !== '') : [];

                words[index] = { eng: newEng.trim(), meanings: newMeanings, examples: newExamples };
                saveWords();
                renderWordList();
            });

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '삭제';
            delBtn.addEventListener('click', () => {
                if (confirm(`'${itemObj.eng}' 항목을 삭제하시겠습니까?`)) {
                    words.splice(index, 1);
                    saveWords();
                    renderWordList();
                }
            });

            actionDiv.appendChild(editBtn);
            actionDiv.appendChild(delBtn);
            item.appendChild(actionDiv);
            container.appendChild(item);
        });
    }

    let quizList = [];
    let currentQuizIndex = 0;
    let quizScore = 0;

    function startQuiz() {
        const quizArea = document.getElementById('quizArea');

        if (words.length < 5) {
            quizArea.innerHTML = `<div class="empty-state">퀴즈를 풀려면 현재 폴더에 최소 5개 이상의 단어가 필요합니다!<br>(현재 단어 수: ${words.length}개)</div>`;
            return;
        }

        const indices = [...Array(words.length).keys()];
        quizList = indices.sort(() => 0.5 - Math.random()).slice(0, 5);
        currentQuizIndex = 0;
        quizScore = 0;
        showQuestion();
    }

    function showQuestion() {
        const quizArea = document.getElementById('quizArea');
        if (currentQuizIndex >= quizList.length) {
            quizArea.innerHTML = `
                <div class="quiz-result">
                    🎉 퀴즈 완료!<br><br>
                    총 5문제 중 <span style="color:var(--primary);">${quizScore}</span>문제를 맞추셨습니다!
                    <br><br>
                    <button class="btn" onclick="startQuiz()">다시 풀기</button>
                </div>
            `;
            return;
        }

        const correctIndex = quizList[currentQuizIndex];
        const correctItem = words[correctIndex];

        const correctMea = correctItem.meanings[Math.floor(Math.random() * correctItem.meanings.length)];

        let questionType = '단어 퀴즈';
        let questionText = correctItem.eng;

        if (correctItem.examples && correctItem.examples.length > 0 && Math.random() > 0.4) {
            questionType = '예문 빈칸 퀴즈';
            const rawEx = correctItem.examples[Math.floor(Math.random() * correctItem.examples.length)];
            questionText = rawEx.replace(/_+/g, '_______');
        }

        let allOtherMeanings = [];
        words.forEach((item, idx) => {
            if (idx !== correctIndex) {
                item.meanings.forEach(m => {
                    if (m !== correctMea) {
                        allOtherMeanings.push(m);
                    }
                });
            }
        });

        let uniqueDistractors = [...new Set(allOtherMeanings)];
        
        if (uniqueDistractors.length < 4) {
            words.forEach(item => {
                item.meanings.forEach(m => {
                    if (m !== correctMea && !uniqueDistractors.includes(m)) {
                        uniqueDistractors.push(m);
                    }
                });
            });
        }

        const shuffledDistractors = uniqueDistractors.sort(() => 0.5 - Math.random()).slice(0, 4);
        const choices = [correctMea, ...shuffledDistractors].sort(() => 0.5 - Math.random());

        quizArea.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 0.85rem; color: var(--text-secondary);">문제 ${currentQuizIndex + 1} / 5</span>
                <span class="quiz-badge">${questionType}</span>
            </div>
            <div class="quiz-card">
                <div class="quiz-question">${escapeHtml(questionText)}</div>
                <div class="choices" id="choicesContainer"></div>
            </div>
        `;

        const choicesContainer = document.getElementById('choicesContainer');
        choices.forEach(choiceText => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = choiceText;
            btn.addEventListener('click', () => {
                Array.from(choicesContainer.children).forEach(b => b.disabled = true);

                if (choiceText === correctMea) {
                    btn.classList.add('correct');
                    quizScore++;
                } else {
                    btn.classList.add('incorrect');
                    Array.from(choicesContainer.children).forEach(b => {
                        if (b.textContent === correctMea) b.classList.add('correct');
                    });
                }

                setTimeout(() => {
                    currentQuizIndex++;
                    showQuestion();
                }, 1000);
            });
            choicesContainer.appendChild(btn);
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
